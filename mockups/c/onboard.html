<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digits · Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter+Tight:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="takeover">

  <div class="takeover__mark">
    <!-- house-in-a-ring -->
    <svg width="88" height="88" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#c48b3a" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.7"/>
      <path d="M 18 44 L 40 26 L 62 44 L 62 64 L 18 64 Z" fill="none" stroke="#2a1f18" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="34" y="52" width="12" height="12" fill="none" stroke="#2a1f18" stroke-width="1.4"/>
      <circle cx="40" cy="64" r="2.5" fill="#c48b3a"/>
    </svg>
  </div>

  <div class="eyebrow" style="margin-bottom:12px;">Step 1 of 3</div>
  <h1 class="takeover__title">What do you call your <em>family</em>?</h1>
  <p class="takeover__sub">This is the name above the door. You&rsquo;ll see it on every page, and on invitations to connect with other houses.</p>

  <div class="card-paper">
    <form onsubmit="event.preventDefault();">
      <div class="field">
        <label class="field__label" for="family">Family name</label>
        <input id="family" class="field__input" type="text" value="Justin Lindh&rsquo;s Family" style="font-family:'Fraunces',serif; font-size:22px; font-variation-settings:'opsz' 28,'SOFT' 30; font-weight:420; padding:16px 16px;" />
      </div>
      <button class="btn btn--brass btn--block" type="submit">Continue</button>
    </form>
  </div>

  <p style="margin-top:36px; font-size:13px; color:var(--ink-3); max-width:420px; text-align:center;">You can change this later. Nobody outside your family will see it unless you invite them.</p>

  <button class="theme-toggle" onclick="toggleTheme()" style="position:fixed; top:18px; right:20px;" aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</main>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    try { localStorage.setItem('digits-theme', next); } catch (e) {}
  }
  (function() {
    try {
      const saved = localStorage.getItem('digits-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  })();
</script>
</body>
</html>
