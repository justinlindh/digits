<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter+Tight:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="takeover">

  <div class="takeover__mark">
    <!-- Signature rotary phone illustration -->
    <svg width="140" height="140" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- subtle shadow under the phone -->
      <ellipse cx="90" cy="166" rx="62" ry="5" fill="#2a1f18" opacity="0.12"/>
      <path d="M 26 110 Q 26 92 44 92 L 136 92 Q 154 92 154 110 L 154 144 Q 154 152 146 152 L 34 152 Q 26 152 26 144 Z" fill="#2a1f18"/>
      <rect x="26" y="96" width="128" height="3" fill="#0f0907" opacity="0.35"/>
      <circle cx="90" cy="126" r="22" fill="#3a2c22" stroke="#141010" stroke-width="1.2"/>
      <circle cx="90" cy="126" r="18" fill="none" stroke="#c48b3a" stroke-width="0.8" opacity="0.9"/>
      <g fill="#14100d">
        <circle cx="90" cy="112" r="2.5"/><circle cx="100" cy="114.5" r="2.5"/>
        <circle cx="106" cy="122" r="2.5"/><circle cx="106" cy="131" r="2.5"/>
        <circle cx="100" cy="138" r="2.5"/><circle cx="90" cy="140" r="2.5"/>
        <circle cx="80" cy="138" r="2.5"/><circle cx="74" cy="131" r="2.5"/>
        <circle cx="74" cy="122" r="2.5"/><circle cx="80" cy="114.5" r="2.5"/>
      </g>
      <circle cx="90" cy="126" r="6" fill="#c48b3a"/>
      <rect x="42" y="86" width="14" height="10" rx="2" fill="#1a1310"/>
      <rect x="124" y="86" width="14" height="10" rx="2" fill="#1a1310"/>
      <path d="M 40 60 Q 44 38 64 38 L 116 38 Q 136 38 140 60 L 130 64 Q 126 50 110 50 L 70 50 Q 54 50 50 64 Z" fill="#2a1f18"/>
      <ellipse cx="50" cy="62" rx="8" ry="5" fill="#1a1310"/>
      <ellipse cx="130" cy="62" rx="8" ry="5" fill="#1a1310"/>
      <path d="M 140 58 Q 162 60 164 72 Q 166 86 150 88" fill="none" stroke="#2a1f18" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 class="takeover__title">Welcome to <em>Digits</em>.</h1>
  <p class="takeover__sub">A private phone network for your family. No feeds, no ads, no screens. Just a real phone that rings.</p>

  <div class="card-paper">
    <button class="btn btn--primary btn--block">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider-or">or</div>

    <form onsubmit="event.preventDefault();">
      <div class="field">
        <label class="field__label" for="email">Email for magic link</label>
        <input id="email" class="field__input" type="email" placeholder="you@yourfamily.com" />
      </div>
      <button class="btn btn--block" type="submit">Send magic link</button>
    </form>
  </div>

  <p style="margin-top:40px; font-size:12.5px; color:var(--ink-3); letter-spacing:0.04em;">By signing in you agree to our gentle <a href="#" style="color:var(--brass-deep);">terms</a>.</p>

  <button class="theme-toggle" onclick="toggleTheme()" style="position:fixed; top:18px; right:20px;" aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</main>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    try { localStorage.setItem('digits-theme', next); } catch (e) {}
  }
  (function() {
    try {
      const saved = localStorage.getItem('digits-theme');
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  })();
</script>
</body>
</html>
