services:
  signald:
    image: ghcr.io/justinlindh/digits/signald:v${BUILD_VERSION}
    restart: unless-stopped
    environment:
      SIGNALD_ADDR: ":8080"
      DATABASE_URL: "postgres://${DB_USER:-digits}:${DB_PASSWORD}@user-db:5432/digits?sslmode=disable"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@digits.family}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-https://app.digits.family/auth/google/callback}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.digits.family}"
      BASE_URL: "${BASE_URL:-https://app.digits.family}"
      ADMIN_SECRET: "${ADMIN_SECRET}"
      GITHUB_REPO: "justinlindh/digits"
      DEV_MODE: "false"
      LOG_FORMAT: "json"
      SIGNALD_TURN_ENABLED: "${SIGNALD_TURN_ENABLED:-false}"
      SIGNALD_TURN_SECRET: "${SIGNALD_TURN_SECRET:-}"
      SIGNALD_TURN_DOMAIN: "${SIGNALD_TURN_DOMAIN:-}"
      SIGNALD_METRICS_ADDR: ":9091"
    ports:
      - "8090:8080"
      # Metrics listener. Bound on all interfaces inside the container; the
      # host-side mapping limits exposure to the loopback or local-network
      # IP, never the public internet. The cluster Prometheus scrapes via
      # the docker host IP on this port.
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      user-db:
        condition: service_healthy

  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: digits
      POSTGRES_USER: digits
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digits"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  user_pgdata:
