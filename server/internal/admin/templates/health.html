{{define "content"}}
<h1 class="text-2xl font-bold mb-6">System Health</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="bg-gray-800 rounded-lg p-4">
        <h2 class="font-medium mb-2">digits-server</h2>
        {{if .StatsError}}
        <span class="text-red-400">● Unreachable</span>
        <p class="text-sm text-gray-400 mt-1">{{.StatsError}}</p>
        {{else}}
        <span class="text-green-400">● Connected</span>
        <p class="text-sm text-gray-400 mt-1">{{.Stats.OnlinePhones}} phones online, {{.Stats.ActiveCalls}} active calls</p>
        {{end}}
    </div>
    <div class="bg-gray-800 rounded-lg p-4">
        <h2 class="font-medium mb-2">admin-db</h2>
        {{if .DBHealthy}}
        <span class="text-green-400">● Healthy</span>
        {{else}}
        <span class="text-red-400">● Unhealthy</span>
        {{end}}
    </div>
</div>
{{end}}
