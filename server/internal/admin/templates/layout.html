<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digits Admin</title>
    <link rel="stylesheet" href="/admin/static/tailwind.css">
    <script src="/admin/static/htmx.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    {{if ne .Page "login"}}
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <span class="text-lg font-bold text-indigo-400">Digits Admin</span>
            <a href="/admin/" class="hover:text-indigo-300 {{if eq .Page "dashboard"}}text-indigo-300{{end}}">Dashboard</a>
            <a href="/admin/users" class="hover:text-indigo-300 {{if eq .Page "users"}}text-indigo-300{{end}}">Users</a>
            <a href="/admin/households" class="hover:text-indigo-300 {{if eq .Page "households"}}text-indigo-300{{end}}">Households</a>
            <a href="/admin/health" class="hover:text-indigo-300 {{if eq .Page "health"}}text-indigo-300{{end}}">Health</a>
        </div>
        <form method="POST" action="/admin/logout">
            <button type="submit" class="text-gray-400 hover:text-red-400 text-sm">Logout</button>
        </form>
    </nav>
    {{end}}
    <main class="max-w-6xl mx-auto px-6 py-8">
        {{template "content" .}}
    </main>
</body>
</html>
