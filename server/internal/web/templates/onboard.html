{{define "title"}}Welcome to Digits{{end}}

{{define "content"}}
<div class="auth">
  <div class="auth__frame">

    <h1 class="auth__mark">Welcome to <em>Digits</em></h1>
    <p class="auth__tagline">Set up your family. You can change the name later.</p>

    <div class="auth__card">
      <form action="/onboard" method="POST" class="stack-md">
        <div class="field" style="margin: 0;">
          <label for="name" class="field__label">Family name</label>
          <input type="text" id="name" name="name" required
            value="{{.SuggestedName}}"
            placeholder="The Smith Family"
            class="field__input"
            autofocus>
        </div>
        <button type="submit" class="btn btn--brass" style="width: 100%;">Create household</button>
      </form>
    </div>

  </div>
</div>
{{end}}
