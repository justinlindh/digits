# V2 carrier sample-rate workaround.
#
# The TLV320AIC3104 is fed a 12.288 MHz MCLK from Pi GPCLK0. At 48 kHz the
# codec uses PLL-bypass mode (12.288 / 256 = exact 48 kHz integer divisor),
# which passes GPCLK0's fractional-divider jitter straight into the audio
# stage and produces audible static. At 44.1 kHz the codec uses PLL
# multiplication, whose loop filter rejects the same jitter cleanly.
# digitsd's capture pipeline (RNNoise, Opus framing) is locked to 48 kHz,
# so we cannot just open the codec at 44.1 kHz everywhere. Instead, define
# a virtual PCM that pins the hardware to 44.1 kHz and exposes any rate to
# applications via libasound's `plug` resampler. digitsd opens this device
# on V2 only; V1 (Codec Zero HAT) keeps using plughw:CARD=Zero,DEV=0
# directly because its codec runs cleanly at 48 kHz.
pcm.digits_capture {
    type plug
    slave {
        pcm "hw:CARD=digitscodec,DEV=0"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.digits_playback {
    type plug
    slave {
        pcm "hw:CARD=digitscodec,DEV=0"
        rate 44100
        format S16_LE
        channels 2
    }
}
