# Digits AP mode dnsmasq configuration
# Active only during initial Wi-Fi provisioning (AP mode).

# Bind to wlan0 only
interface=wlan0
bind-interfaces

# DHCP range: 192.168.4.10-50, 24h lease
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,24h

# DNS wildcard: resolve all names to 192.168.4.1 (captive portal)
address=/#/192.168.4.1

# Don't read /etc/resolv.conf or any other config
no-resolv

# Don't forward plain names (without a dot)
domain-needed

# Lease file on writable /data partition (rootfs is read-only)
dhcp-leasefile=/data/dnsmasq.leases
