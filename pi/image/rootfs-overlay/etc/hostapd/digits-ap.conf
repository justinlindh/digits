# Digits AP mode hostapd configuration
# SSID is set at first boot by /usr/local/bin/digits-first-boot
# based on the last 4 digits of the Pi serial number.

interface=wlan0
driver=nl80211

# SSID: Digits-XXXX (XXXX replaced at first boot)
ssid=Digits-XXXX

# 2.4GHz, channel 6
hw_mode=g
channel=6

# Open network (no password) for easy onboarding
auth_algs=1
wpa=0

# Country code (update if deploying outside US)
country_code=US
ieee80211d=1
ieee80211n=1

# Misc
wmm_enabled=1
macaddr_acl=0
ignore_broadcast_ssid=0
