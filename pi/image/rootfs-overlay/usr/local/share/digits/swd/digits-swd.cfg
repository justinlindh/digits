# digits-swd.cfg: OpenOCD config for Pi Zero 2 W bitbang SWD to bare RP2040 on
# the V2 carrier. V1/prototype used Pico H with SWDIO on GPIO22; V2 moved SWDIO
# to GPIO24 to free GPIO22 for CODEC_RESET. Update the pin pair below if the
# carrier wiring ever changes again.
#
# V2 carrier wiring: Pi GPIO 24 = SWDIO (J1 pin 18), Pi GPIO 25 = SWCLK (J1 pin 22)
# Pi Zero 2 W uses BCM2710A1 (BCM2837 family).

adapter driver bcm2835gpio

# BCM2837 peripheral base
bcm2835gpio peripheral_base 0x3F000000

# Pi Zero 2 W speed coefficients (1 GHz quad-core, similar to Pi 3)
bcm2835gpio speed_coeffs 194938 48

transport select swd

# SWD pin assignment: swclk swdio
bcm2835gpio swd_nums 25 24

# Adaptive clocking not supported. Use fixed 1000 kHz.
adapter speed 1000
