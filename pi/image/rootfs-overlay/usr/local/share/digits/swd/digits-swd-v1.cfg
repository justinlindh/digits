# digits-swd-v1.cfg: OpenOCD config for the V1/prototype layout where the Pi
# Zero 2 W bitbangs SWD into a Pico H module. V1 wires:
#   Pi GPIO 22 = SWDIO (Pico H SWDIO pad)
#   Pi GPIO 25 = SWCLK (Pico H SWCLK pad)
# Pi Zero 2 W uses BCM2710A1 (BCM2837 family), peripheral base 0x3F000000.
#
# build-image.sh copies this file to digits-swd.cfg at image-build time when
# building without --pcb. For the V2 carrier, see digits-swd-v2.cfg.

adapter driver bcm2835gpio

# BCM2837 peripheral base
bcm2835gpio peripheral_base 0x3F000000

# Pi Zero 2 W speed coefficients (1 GHz quad-core, similar to Pi 3)
bcm2835gpio speed_coeffs 194938 48

transport select swd

# SWD pin assignment: swclk swdio
bcm2835gpio swd_nums 25 22

# Adaptive clocking not supported. Use fixed 1000 kHz.
adapter speed 1000
