name: Pi Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "pi/**"
      - ".gitea/workflows/pi-release.yml"
      - "pi/.releaserc.cjs"

jobs:
  release:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Validate release prerequisites
        run: |
          if [ -z "$GITEA_TOKEN" ]; then
            echo "::error::GITEA_TOKEN secret is not set"
            exit 1
          fi
          echo "Prerequisites OK"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @saithodev/semantic-release-gitea

      - name: Run semantic-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --extends ./pi/.releaserc.cjs --dry-run
          else
            npx semantic-release --extends ./pi/.releaserc.cjs
          fi
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}

      - name: Deploy binary to server
        if: success()
        run: |
          VERSION=$(git tag --sort=-creatordate | grep '^pi/v' | head -1 | sed 's|^pi/v||')
          if [ -z "$VERSION" ] || [ ! -f "artifacts/digitsd-${VERSION}-aarch64" ]; then
            echo "No new release or binary, skipping deploy"
            exit 0
          fi
          # Copy binary into the running server's updates volume
          CONTAINER="${DEPLOY_CONTAINER:-digits-prod-signald-1}"
          docker cp "artifacts/digitsd-${VERSION}-aarch64" "$CONTAINER":/data/updates/digitsd-aarch64
          echo "Deployed digitsd-aarch64 to server updates volume"
        env:
          DEPLOY_CONTAINER: ${{ vars.DEPLOY_CONTAINER }}

      - name: Update release index
        if: success()
        run: |
          VERSION=$(git tag --sort=-creatordate | grep '^pi/v' | head -1 | sed 's|^pi/v||')
          if [ -z "$VERSION" ]; then
            echo "No pi/v tag found, skipping index update"
            exit 0
          fi
          COMMIT=$(git rev-parse --short HEAD)
          SHA256=$(cat "artifacts/digitsd-${VERSION}-aarch64.sha256" 2>/dev/null || echo "")
          if [ -z "$SHA256" ]; then
            echo "No SHA256 found, skipping index update"
            exit 0
          fi
          DOWNLOAD_URL="https://app.digits.family/api/updates/download/digitsd-aarch64"
          bash tools/update-releases-json.sh pi "$VERSION" "$COMMIT" "$SHA256" "$DOWNLOAD_URL"
          # Deploy updated releases.json to server
          CONTAINER="${DEPLOY_CONTAINER:-digits-prod-signald-1}"
          docker cp artifacts/releases.json "$CONTAINER":/data/updates/releases.json
          # Also commit to repo
          git config user.name "Digits CI"
          git config user.email "ci@digits.family"
          git add artifacts/releases.json
          git commit -m "ci: update releases.json for pi/v${VERSION} [skip ci]" || true
          git push origin HEAD:main
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          DEPLOY_CONTAINER: ${{ vars.DEPLOY_CONTAINER }}
