name: Pi Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "pi/**"
      - ".github/workflows/pi-release.yml"
      - "pi/.releaserc.cjs"

# See server-release.yml for why this exists. Serializes release runs
# so back-to-back merges don't race semantic-release into silently
# skipping a tag.
concurrency:
  group: pi-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.released_tag.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache-dependency-path: pi/digitsd/go.sum

      - name: Install aarch64 cross-compiler and libraries
        run: |
          sudo dpkg --add-architecture arm64
          # Pin existing Ubuntu sources to amd64 only
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Architectures:.*/Architectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
            grep -q '^Architectures:' /etc/apt/sources.list.d/ubuntu.sources || \
              sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          # Add arm64 package sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/\nSuites: %s %s-updates\nComponents: main restricted universe\nArchitectures: arm64\n' \
            "$(lsb_release -cs)" "$(lsb_release -cs)" | sudo tee /etc/apt/sources.list.d/arm64.sources
          sudo apt-get update
          # libopusfile-dev:arm64 can't be installed via apt (libssl3t64 conflict),
          # so install other deps normally, then extract opusfile from downloaded debs
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64 libopus-dev:arm64 libogg-dev:arm64 pkg-config
          # Create opusfile pkg-config entry
          sudo bash -c 'printf "prefix=/usr\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib/aarch64-linux-gnu\nincludedir=\${prefix}/include\n\nName: opusfile\nDescription: opusfile for cross-compilation\nVersion: 0.12\nRequires: opus\nLibs: -L\${libdir} -lopusfile\nCflags: -I\${includedir}/opus\n" \
            > /usr/lib/aarch64-linux-gnu/pkgconfig/opusfile.pc'
          # Extract opusfile headers and libs from downloaded debs
          apt-get download libopusfile-dev libopusfile0:arm64
          dpkg-deb -x libopusfile-dev*.deb /tmp/opusfile-dev
          dpkg-deb -x libopusfile0*.deb /tmp/opusfile-lib
          sudo cp /tmp/opusfile-dev/usr/include/opus/opusfile.h /usr/include/opus/
          sudo cp /tmp/opusfile-lib/usr/lib/aarch64-linux-gnu/libopusfile.so* /usr/lib/aarch64-linux-gnu/
          sudo ln -sf libopusfile.so.0 /usr/lib/aarch64-linux-gnu/libopusfile.so
          sudo ldconfig
          rm -rf /tmp/opusfile-dev /tmp/opusfile-lib *.deb

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --extends ./pi/.releaserc.cjs --dry-run
          else
            npx semantic-release --extends ./pi/.releaserc.cjs
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Detect released tag
        id: released_tag
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^pi/v' | sort -V | tail -n1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released $tag"
          else
            echo "No pi release was created"
          fi

  groom:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-groom.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
