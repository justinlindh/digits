name: Server CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          # Self-hosted runners carry a persistent local Go cache, so actions/cache traffic is pure waste; the ubuntu-latest fallback (forks, homelab pool disabled) forgoes Go caching by design.
          cache: false

      - name: Build
        working-directory: server
        run: go build -o bin/signald ./cmd/signald/

      - name: Build autodeploy
        working-directory: server
        run: go build -o bin/autodeploy ./cmd/autodeploy/

      - name: Unit tests
        working-directory: server
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: server
        run: go vet ./...
