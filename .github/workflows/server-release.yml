name: Server Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-release.yml"

# Serialize release runs so two PRs merging back-to-back don't race
# semantic-release. Without this, the second run's checkout is "behind"
# the now-advanced remote main and semantic-release bails with
# "The local branch main is behind the remote one, therefore a new
# version won't be published" -- silently skipping the tag for that
# PR's commits. cancel-in-progress=false queues the second run instead
# of cancelling, so each merge eventually gets analyzed.
concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    outputs:
      new_release_published: ${{ steps.semrel.outputs.new_release_published }}
      new_release_version: ${{ steps.semrel.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install semantic-release
        run: npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github @semantic-release/exec conventional-changelog-conventionalcommits

      - name: Run semantic-release
        id: semrel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push signald
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/justinlindh/digits/signald:v${{ needs.release.outputs.new_release_version }}
            ghcr.io/justinlindh/digits/signald:latest

      - name: Build and push admind
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/cmd/admind/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/justinlindh/digits/admind:v${{ needs.release.outputs.new_release_version }}
            ghcr.io/justinlindh/digits/admind:latest
