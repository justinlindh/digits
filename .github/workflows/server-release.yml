name: Server Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-release.yml"
  # Daily catch-up for releases stranded by the behind-remote race described
  # below. The race window is small once checkout uses the branch tip, but a
  # push landing mid-run in a component that never touches this workflow's
  # paths would still strand the release with no retry until the next
  # path-matching push.
  schedule:
    - cron: "47 9 * * *"

# Serialize release runs so two PRs merging back-to-back don't race
# semantic-release. Without this, the second run's checkout is "behind"
# the now-advanced remote main and semantic-release bails with
# "The local branch main is behind the remote one, therefore a new
# version won't be published" -- silently skipping the tag for that
# PR's commits. cancel-in-progress=false queues the second run instead
# of cancelling, so each merge eventually gets analyzed.
#
# Two hardenings on top of the concurrency group, because it only
# serializes runs of THIS workflow while the behind-remote check compares
# against every push to main: merges in other components advance main too
# (fw/v1.14.2 sat unreleased for two weeks in July 2026 when fix #850 lost
# exactly that race twice). The release job checks out ref main instead of
# the triggering github.sha so a queued run analyzes the current tip, and
# the schedule trigger above retries daily in case a mid-run push still
# wins the race.
concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: server
    outputs:
      new_release_published: ${{ steps.semrel.outputs.new_release_published }}
      new_release_version: ${{ steps.semrel.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semrel.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Branch tip, not github.sha: see the behind-remote comment above.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install semantic-release
        run: npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github @semantic-release/exec conventional-changelog-conventionalcommits

      - name: Run semantic-release
        id: semrel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-images:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push signald
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/justinlindh/digits/signald:v${{ needs.release.outputs.new_release_version }}
            ghcr.io/justinlindh/digits/signald:latest

  groom:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-groom.yml
    with:
      tag: ${{ needs.release.outputs.new_release_git_tag }}
    secrets: inherit
