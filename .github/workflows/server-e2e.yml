name: Server E2E

on:
  pull_request:
    paths:
      - 'server/internal/web/**'
      - 'server/internal/admin/**'
      - 'server/e2e/**'
      - '.github/workflows/server-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digits
          POSTGRES_PASSWORD: digits
          POSTGRES_DB: digits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build server
        working-directory: server
        run: go build -o bin/signald ./cmd/signald/

      - name: Start server
        working-directory: server
        run: |
          ./bin/signald &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
        env:
          DEV_MODE: "true"
          DATABASE_URL: postgres://digits:digits@localhost:5432/digits_test?sslmode=disable
          SIGNALD_ADDR: :8080
          BASE_URL: http://localhost:8080

      - name: Wait for server health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Install Playwright
        working-directory: server/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: server/e2e
        run: npx playwright test
        env:
          CI: "true"
          BASE_URL: http://localhost:8080

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            server/e2e/playwright-report/
            server/e2e/test-results/
          retention-days: 14
