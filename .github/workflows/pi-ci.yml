name: Pi CI

on:
  push:
    branches: [main]
    paths:
      - 'pi/digitsd/**'
      - '.github/workflows/pi-ci.yml'
  pull_request:
    paths:
      - 'pi/digitsd/**'
      - '.github/workflows/pi-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-digitsd:
    name: test-digitsd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache-dependency-path: pi/digitsd/go.sum
      - name: Install C dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev libopusfile-dev
      - name: Populate embed tree
        working-directory: pi/digitsd
        run: make embed
      - name: Build digitsd
        working-directory: pi/digitsd
        run: go build ./...
      - name: Test digitsd (with race detector)
        working-directory: pi/digitsd
        run: go test -race ./...
