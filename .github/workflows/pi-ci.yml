name: Pi CI

on:
  push:
    branches: [main]
    paths:
      - 'pi/digitsd/**'
      - 'pi/image/rootfs-overlay/**'
      - 'pi/tones/**'
      - 'pi/mixer-state/**'
      - '.github/workflows/pi-ci.yml'
  pull_request:
    paths:
      - 'pi/digitsd/**'
      - 'pi/image/rootfs-overlay/**'
      - 'pi/tones/**'
      - 'pi/mixer-state/**'
      - '.github/workflows/pi-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-digitsd:
    name: test-digitsd
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          # Go caches never go through actions/cache. Self-hosted runners rely on whatever local cache the runner set mounts; the ubuntu-latest fallback builds cold.
          cache: false
      - name: Install C dependencies
        run: |
          pkgs="libasound2-dev libopus-dev libopusfile-dev"
          dpkg -s $pkgs >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y $pkgs; }
      - name: Populate embed tree
        working-directory: pi/digitsd
        run: make embed
      - name: Build digitsd
        working-directory: pi/digitsd
        run: go build ./...
      - name: Test digitsd (with race detector)
        working-directory: pi/digitsd
        run: go test -race ./...
