name: Groom Release Notes

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to groom (e.g. fw/v1.4.0).'
        required: true
        type: string
      force:
        description: 'Re-groom even if already groomed.'
        required: false
        default: false
        type: boolean
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to re-groom (e.g. fw/v1.4.0). Bypasses the idempotency sentinel.'
        required: true
        type: string
      force:
        description: 'Re-groom even if already groomed'
        required: false
        default: false
        type: boolean

jobs:
  groom:
    # Deliberately GitHub-hosted: release-path jobs stay off the homelab runner pool so
    # releases still groom when it is down, and this job needs the gh CLI that the
    # hosted image guarantees. Matches fw/pi/server-release.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release body
        id: body
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          printf '%s\n' "$body" > /tmp/raw.md
          if [ "$FORCE" != "true" ] && head -n1 /tmp/raw.md | grep -q '<!-- groomed:v1 -->'; then
            echo "already_groomed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_groomed=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'RAW_BODY<<GROOM_EOF_RAW'
            cat /tmp/raw.md
            echo 'GROOM_EOF_RAW'
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already groomed
        if: steps.body.outputs.already_groomed == 'true'
        run: echo "Release $TAG already groomed; skipping."

      - name: Collect compare commits
        if: steps.body.outputs.already_groomed != 'true'
        id: commits
        run: |
          prefix=$(echo "$TAG" | cut -d/ -f1)
          prev=$(git tag --list "${prefix}/v*" | sort -V | grep -B1 "^${TAG}$" | head -n1 || true)
          if [ -n "$prev" ] && [ "$prev" != "$TAG" ]; then
            git log --format='%H%x09%an%x09%s' "${prev}..${TAG}" > /tmp/raw-commits.tsv || true
          else
            git log --format='%H%x09%an%x09%s' "${TAG}" -n 50 > /tmp/raw-commits.tsv
          fi
          # Tag commits from outside contributors so the groomer can credit
          # them. Bots and the repo owner get no tag and read as Justin.
          # Author lookup goes through the API because the squash-merge git
          # identity is whatever GitHub put there (often just the login).
          : > /tmp/commits.txt
          while IFS=$'\t' read -r sha name subject; do
            credit=""
            author=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" \
              --jq '.author // empty | select(.type != "Bot") | .login' 2>/dev/null || true)
            if [ -n "$author" ]; then
              if [ "$author" != "$OWNER" ]; then
                display=$(gh api "users/${author}" --jq '.name // empty' 2>/dev/null || true)
                if [ -z "$display" ]; then
                  # No profile name; use the git author name from the PR's own commits.
                  pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
                  if [ -n "$pr" ]; then
                    display=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/commits" 2>/dev/null \
                      | jq -r --arg login "$author" '[.[] | select(.author.login == $login) | .commit.author.name] | map(select(. != "" and . != $login)) | first // empty' 2>/dev/null || true)
                  fi
                fi
                credit=" [contributed by ${display:-$author}]"
              fi
            elif [[ "$name" != *"[bot]" ]]; then
              credit=" [contributed by ${name}]"
            fi
            printf '%s%s\n' "$subject" "$credit" >> /tmp/commits.txt
          done < /tmp/raw-commits.tsv
          wc -l /tmp/commits.txt
          {
            echo 'COMMITS<<GROOM_EOF_COMMITS'
            cat /tmp/commits.txt
            echo 'GROOM_EOF_COMMITS'
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Groom notes with Claude
        if: steps.body.outputs.already_groomed != 'true'
        id: claude
        uses: anthropics/claude-code-action/base-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --append-system-prompt-file .github/release-voice.md
            --allowedTools Write Bash
          prompt: |
            Groom these release notes for the Digits release ${{ env.TAG }}.
            Use the Write tool (or a Bash heredoc) to save your output to
            exactly /tmp/groomed.md. The first line of the file must be the
            sentinel `<!-- groomed:v1 -->`. Nothing else. No preamble in chat,
            no explanation, just write the file.

            Raw release body:
            ${{ env.RAW_BODY }}

            Commits in this release:
            ${{ env.COMMITS }}

      - name: Update release body
        if: steps.body.outputs.already_groomed != 'true' && steps.claude.outcome == 'success'
        run: |
          if [ ! -s /tmp/groomed.md ]; then
            echo "Groomed output is empty; leaving raw body in place."
            exit 0
          fi
          if ! head -n1 /tmp/groomed.md | grep -q '<!-- groomed:v1 -->'; then
            sed -i '1i <!-- groomed:v1 -->' /tmp/groomed.md
          fi
          gh release edit "$TAG" --notes-file /tmp/groomed.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report skip or failure
        if: steps.claude.outcome != 'success'
        run: |
          echo "Claude step did not succeed; leaving the raw release body untouched."
          echo "The UI fallback will render the raw body as-is."
