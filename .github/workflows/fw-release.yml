name: Firmware Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/fw-release.yml"
      - "firmware/.releaserc-full.cjs"
      - "firmware/.releaserc-tagonly.cjs"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.released_tag.outputs.tag }}
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Pico SDK build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake libnewlib-arm-none-eabi
          # Install Pico SDK
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cd /tmp/pico-sdk && git submodule update --init
          echo "PICO_SDK_PATH=/tmp/pico-sdk" >> "$GITHUB_ENV"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        run: |
          CAN_BUILD=false
          if command -v arm-none-eabi-gcc >/dev/null 2>&1 && command -v cmake >/dev/null 2>&1; then
            CAN_BUILD=true
          fi

          if [ "$CAN_BUILD" = "true" ]; then
            echo "Build toolchain available -- full release with firmware build"
            RELEASERC="./.releaserc-full.cjs"
          else
            echo "::warning::Build toolchain not available -- tag-only release"
            RELEASERC="./.releaserc-tagonly.cjs"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --extends "$RELEASERC" --dry-run
          else
            npx semantic-release --extends "$RELEASERC"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}

      - name: Detect released tag
        id: released_tag
        working-directory: ${{ github.workspace }}
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^fw/v' | sort -V | tail -n1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Released $tag"
          else
            echo "No firmware release was created"
          fi

  groom:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-groom.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
