name: Lint

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'server/**'
      - 'pi/digitsd/**'
      - '.golangci.yml'
      - '.github/workflows/golangci-lint.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'pi/digitsd/**'
      - '.golangci.yml'
      - '.github/workflows/golangci-lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-server:
    name: lint-server
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          # Go caches never go through actions/cache. Self-hosted runners rely on whatever local cache the runner set mounts; the ubuntu-latest fallback builds cold.
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: server

  lint-digitsd:
    name: lint-digitsd
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.1'
          # Go caches never go through actions/cache. Self-hosted runners rely on whatever local cache the runner set mounts; the ubuntu-latest fallback builds cold.
          cache: false
      - name: Install C dependencies
        run: |
          pkgs="libasound2-dev libopus-dev libopusfile-dev"
          dpkg -s $pkgs >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y $pkgs; }
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: pi/digitsd
