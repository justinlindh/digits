name: Helm CI

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  pull_request:
    paths:
      - "charts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-template:
    # Fork-head PRs run GitHub-hosted so fork code never reaches the
    # self-hosted pool; same-repo PRs, pushes, and dispatches follow
    # RUNNER_LABEL.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kubeconform-bin"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/kubeconform-bin" kubeconform
          echo "$RUNNER_TEMP/kubeconform-bin" >> "$GITHUB_PATH"

      - name: Lint (defaults)
        run: helm lint charts/digits/

      - name: Lint (all features enabled)
        run: |
          helm lint charts/digits/ \
            --set ingress.enabled=true \
            --set ingress.signald.host=app.example.com \
            --set cnpg.enabled=true \
            --set redis.enabled=true \
            --set observability.enabled=true \
            --set observability.otelEndpoint=otel:4317 \
            --set observability.serviceMonitor.enabled=true

      - name: Template (defaults)
        run: helm template digits charts/digits/ --namespace digits > "$RUNNER_TEMP/rendered-defaults.yaml"

      - name: Template (all features enabled)
        run: |
          helm template digits charts/digits/ --namespace digits \
            --set ingress.enabled=true \
            --set ingress.signald.host=app.example.com \
            --set cnpg.enabled=true \
            --set cnpg.userdb.storageClass=default \
            --set cnpg.backup.enabled=true \
            --set cnpg.backup.destinationPath=s3://backups \
            --set cnpg.backup.endpointURL=http://minio:9000 \
            --set cnpg.backup.s3CredentialsSecret=minio-creds \
            --set redis.enabled=true \
            --set observability.enabled=true \
            --set observability.otelEndpoint=otel:4317 \
            --set observability.pyroscopeEndpoint=http://pyroscope:4040 \
            --set observability.serviceMonitor.enabled=true \
            > "$RUNNER_TEMP/rendered-all.yaml"

      # -skip names the exact CRD-backed kinds with no upstream JSON schema (CNPG Cluster, Prometheus
      # operator PodMonitor/ServiceMonitor). Scoping the skip rather than -ignore-missing-schemas means a
      # typo'd core kind, or an unreachable schema host, fails the step instead of being silently passed over.
      - name: Validate rendered manifests (kubeconform)
        run: |
          kubeconform -strict -summary -skip Cluster,PodMonitor,ServiceMonitor \
            "$RUNNER_TEMP/rendered-defaults.yaml" "$RUNNER_TEMP/rendered-all.yaml"
