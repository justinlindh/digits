version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - durationcheck
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - makezero
    - mirror
    - misspell
    - nilerr
    - nilnesserr
    - reassign
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - tparallel
    - wastedassign

run:
  timeout: 5m
