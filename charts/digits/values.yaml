nameOverride: ""
fullnameOverride: ""

signald:
  image:
    repository: ghcr.io/justinlindh/digits/signald
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  env: {}
  envFrom: []
  # Container port for the HTTP/WebSocket listener.
  port: 8080

admind:
  image:
    repository: ghcr.io/justinlindh/digits/admind
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  env: {}
  envFrom: []
  # Container port for the admin HTTP listener.
  port: 9090
  # Secret reference for ADMIN_STATS_SECRET (remapped from the shared secret).
  statsSecretRef:
    name: digits-secrets
    key: ADMIN_SECRET

ingress:
  enabled: false
  className: ""
  signald:
    host: ""
  admind:
    host: ""

# Redis pub/sub for multi-replica signaling. When set, signald uses Redis as
# a shared broadcast channel so cross-pod calls reach the right device.
# Leave empty for single-replica deployments. For passwords or rotating
# credentials, leave url empty here and inject REDIS_URL via signald.envFrom
# (an existing secret) instead.
redis:
  url: ""

cnpg:
  enabled: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  userdb:
    instances: 2
    size: 10Gi
    storageClass: ""
    database: digits
    owner: digits
  admindb:
    instances: 2
    size: 5Gi
    storageClass: ""
    database: digits_admin
    owner: digits_admin
  backup:
    enabled: false
    retentionPolicy: "14d"
    destinationPath: ""
    endpointURL: ""
    s3CredentialsSecret: ""
    s3AccessKeyIDKey: ACCESS_KEY_ID
    s3SecretAccessKeyKey: ACCESS_SECRET_KEY

observability:
  enabled: false
  otelEndpoint: ""
  otelProtocol: "grpc"
  otelInsecure: "true"
  otelResourceAttributes: ""
  pyroscopeEndpoint: ""
  signaldMetricsPort: 9091
  admindMetricsPort: 9092
  serviceMonitor:
    enabled: false
    interval: 30s
